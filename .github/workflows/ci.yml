name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust workspace ──────────────────────────────────────────
  rust:
    name: Rust ${{ matrix.rust-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust-version: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust-version }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Doc-tests
        run: cargo test --doc --workspace

  # ── Frontend ────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --ext ts,tsx --max-warnings 0 || true

      - name: Build
        run: npm run build

  # ── Security audit (cargo-deny) ─────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  # ── Success gate ────────────────────────────────────────────
  all-pass:
    name: All CI checks
    if: always()
    needs: [rust, frontend, security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        run: |
          echo "rust:        ${{ needs.rust.result }}"
          echo "frontend:    ${{ needs.frontend.result }}"
          echo "security:    ${{ needs.security-audit.result }}"
          if [[ \
            "${{ needs.rust.result }}" != "success" || \
            "${{ needs.frontend.result }}" != "success" || \
            "${{ needs.security-audit.result }}" != "success" \
          ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi