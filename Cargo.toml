[workspace]
resolver = "2"

members = [
    "crates/tiny-mite-core",
    "crates/tiny-mite-domain",
    "crates/tiny-mite-events",
    "crates/tiny-mite-runtime",
    "crates/tiny-mite-memory",
    "crates/tiny-mite-retrieval",
    "crates/tiny-mite-security",
    "crates/tiny-mite-agents",
    "crates/tiny-mite-tools",
    "crates/tiny-mite-scheduler",
    "crates/tiny-mite-llama-cpp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tiny-mite/tiny-mite"
rust-version = "1.85"

[workspace.dependencies]
# Core utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
once_cell = "1"
dashmap = "6"

# Event persistence
rmp-serde = "1"
lz4_flex = "0.11"

# Configuration
toml = "0.9"
directories = "6"

# Embedded database
rusqlite = { version = "0.34", features = ["bundled"] }

# Async runtime utilities
async-trait = "0.1"
futures = "0.3"

# Testing
rstest = "0.25"
tempfile = "3"
proptest = "1"
mockall = "0.13"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
unwrap_used = "warn"
expect_used = "warn"
# Allow some pedantic lints that are too strict
module_name_repetitions = "allow"
must_use_candidate = "allow"