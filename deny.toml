# Tiny Mite — cargo-deny configuration
# Used by CI security-audit job to enforce license, ban, and advisory policies.
#
# Run locally: cargo deny check bans licenses sources

[graph]
all-features = false
no-default-features = false

[advisories]
# Lint level for security advisories
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
unsound = "deny"
yanked = "warn"
notice = "warn"
ignore = []

[licenses]
# Prefer permissive licenses. Copyleft requires explicit approval.
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
]
# Crates whose license we explicitly allow despite not being in the general allow list.
exceptions = [
    # Allow Unicode-DFS-2016 for unicode-ident (transitive proc-macro dep)
    { name = "unicode-ident", allow = ["Unicode-3.0", "MIT", "Apache-2.0"] },
]

[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
allow-registry = ["https://github.com/rust-lang/crates.io-index"]